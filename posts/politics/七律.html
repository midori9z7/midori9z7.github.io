<h1>七律
    </h1>
<p><pre>
日耀月飞销铁堆，天怜血溅烟雨灰。
日月新天岂照我，宵却孤魂归不归？
百代奔流无驻止，千林随浪向东颓。
竖子成名竖子命，东南自挂莫举杯。
</pre></p>
